<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kahana AI Agent - UI Prototype</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="prototype-shell">
      <section class="original-site" aria-label="Kahana website">
        <iframe id="siteFrame" src="https://kahana.io/library" title="Kahana website" allow="clipboard-write"></iframe>
      </section>

      <aside class="agent-panel" id="agentPanel" aria-label="Kahana AI Agent">
        <header class="agent-header">
          <div class="agent-heading">
            <div class="agent-icon">AI</div>
            <div>
              <div class="agent-title-row"><strong>Kahana AI Agent</strong><span class="beta">BETA</span></div>
              <span class="agent-subtitle">Your knowledge assistant</span>
            </div>
          </div>
          <div class="header-actions">
            <button class="clear-btn" id="clearButton" title="Clear conversation memory" aria-label="Clear conversation">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 6h18m-2 0v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6m3 0V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>
              </svg>
              <span>Clear</span>
            </button>
            <button class="close-btn" id="closeButton" title="Close" aria-label="Close chatbot">×</button>
          </div>
        </header>

        <section class="message-thread" id="messageThread" aria-live="polite">
          <div class="message-row agent-row"><div class="mini-agent">AI</div><div class="agent-bubble welcome">Hi! I'm Kahana's AI assistant. Ask me anything about hubs, Aura, earning, clubs, or getting started.</div></div>
        </section>

        <form class="composer" id="composer"><textarea id="messageInput" rows="1" placeholder="Ask anything about Kahana..." aria-label="Chat message"></textarea><button class="send-button" type="submit" aria-label="Send">➤</button><p>Kahana AI Agent can make mistakes. Please verify important information.</p></form>
      </aside>

      <button class="ai-ribbon-button" id="reopenButton" title="Kahana AI Agent" aria-label="Toggle Kahana AI Agent">
        <svg class="star-icon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2C12 7.52 7.52 12 2 12C7.52 12 12 16.48 12 22C12 16.48 16.48 12 22 12C16.48 12 12 7.52 12 2Z"/>
        </svg>
      </button>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
