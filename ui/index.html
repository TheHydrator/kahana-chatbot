<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kahana AI Agent - UI Prototype</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="prototype-shell">
      <section class="original-site" aria-label="Kahana website">
        <iframe id="siteFrame" src="https://kahana.io/library" title="Kahana website" allow="clipboard-write"></iframe>
      </section>

      <aside class="agent-panel" id="agentPanel" aria-label="Kahana AI Agent">
        <header class="agent-header">
          <div class="agent-heading">
            <div class="agent-icon">AI</div>
            <div><div class="agent-title-row"><strong>Kahana AI Agent</strong><span class="beta">BETA</span></div><span class="agent-subtitle">Your knowledge assistant</span></div>
          </div>
          <button class="icon-button" id="closeButton" aria-label="Close chatbot">×</button>
        </header>

        <section class="message-thread" id="messageThread" aria-live="polite">
          <div class="message-row agent-row"><div class="mini-agent">AI</div><div class="agent-bubble welcome">Hi! I'm Kahana's AI assistant. Ask me anything about hubs, Aura, earning, clubs, or getting started.</div></div>
        </section>

        <form class="composer" id="composer"><textarea id="messageInput" rows="1" placeholder="Ask anything about Kahana..." aria-label="Chat message"></textarea><button class="send-button" type="submit" aria-label="Send">➤</button><p>Kahana AI Agent can make mistakes. Please verify important information.</p></form>
      </aside>

      <button class="reopen-button" id="reopenButton" aria-label="Open chatbot">AI</button>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
